    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0; padding: 0;
            background: #0f172a; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100dvh; overflow-y: auto; padding: 10px 0;
        }
        .container {
            width: 100%; max-width: 450px; padding: 0 15px; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }
        .hidden { display: none !important; }
        .btn { 
            background: #2563eb; color: white; padding: 12px; margin: 5px 0; border: none; border-radius: 12px; 
            font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.98); background: #1d4ed8; }

        .key-btn { 
            background: #334155; color: white; padding: 8px 0; margin: 2px; border: none; border-radius: 6px; 
            font-size: 14px; font-weight: bold; cursor: pointer; flex: 1; box-shadow: 0 2px 3px rgba(0,0,0,0.2);
            touch-action: manipulation;
        }
        .key-btn:active { background: #1e293b; }
        .key-row { display: flex; width: 100%; justify-content: space-between; margin-bottom: 2px; }

        input, select { 
            width: 100%; padding: 10px; font-size: 16px; text-align: center; border-radius: 10px; 
            border: 2px solid #cbd5e1; margin-bottom: 6px; background: white; color: black; font-weight: bold;
        }
        
        .box { 
            background: #1e293b; border: 3px solid #eab308; border-radius: 16px; padding: 10px; margin: 6px 0; width: 100%; 
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3); position: relative; flex-shrink: 0;
        }
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center; padding: 15px; z-index: 100;
        }
        .modal-content {
            background: #1e1b4b; border: 2px solid #6366f1; border-radius: 20px; padding: 20px; width: 100%; max-width: 400px; text-align: center;
            max-height: 90vh; overflow-y: auto;
        }

        /* 認証ステータスドット */
        .status-dot {
            display: inline-block;
            width: 12px; height: 12px;
            border-radius: 50%; margin-left: 6px;
            vertical-align: middle;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        .dot-red { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .dot-green { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>

    <script>
        let audioCtx = null;
        let soundVolume = 0.5;
        let bgmTimer = null;
        let isApiOnline = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function updateVolume(val) {
            soundVolume = val / 100;
            document.getElementById("volume-val").innerText = val;
            playSound('click');
        }

        function startBGM() {
            stopBGM();
            let notes = [261.63, 329.63, 392.00, 523.25];
            let step = 0;
            bgmTimer = setInterval(() => {
                if (soundVolume <= 0 || isPaused || !audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const now = audioCtx.currentTime;

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[step % notes.length], now);
                    gain.gain.setValueAtTime(0.03 * soundVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    step++;
                } catch(e) {}
            }, 400);
        }

        function stopBGM() {
            if (bgmTimer) clearInterval(bgmTimer);
        }

        function playSound(type) {
            initAudio();
            if (soundVolume <= 0 || !audioCtx) return;
            
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                let baseVolume = 0.2 * soundVolume;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(baseVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    gain.gain.setValueAtTime(baseVolume * 1.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.setValueAtTime(110, now + 0.15);
                    gain.gain.setValueAtTime(baseVolume * 1.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'boss') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(880, now + 0.2);
                    gain.gain.setValueAtTime(baseVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                }
            } catch(e) {}
        }

        // 1000問バリエーション生成ロジック
        function generateFallbackData(mode) {
            const rawPool = KANJI_DATABASE[mode] || KANJI_DATABASE["小学生"];
            // シャッフル
            const shuffled = [...rawPool].sort(() => Math.random() - 0.5);
            
            // 30問抽出して難易度ソート風に配置
            const result = [];
            for (let i = 0; i < 30; i++) {
                const item = shuffled[i % shuffled.length];
                const isBoss = (i + 1) % 5 === 0;
                result.push({
                    id: i + 1,
                    kanji: item[0],
                    reading: item[1],
                    category: isBoss ? `${mode}【BOSS】` : mode,
                    meaning: `【STAGE ${i + 1}】${mode}コースの問題です。`,
                    isBoss: isBoss
                });
            }
            return result;
        }

        let currentList = [];
        let currentIndex = 0;
        let lives = 3;
        let timer = null;
        let timeRemaining = 30;
        let isPaused = false;
        let activeMode = "小学生";
        let inputMode = "keyboard";
        let apiKey = localStorage.getItem("groq_api_key") || "";

        window.onload = () => {
            document.getElementById("api-key-input").value = apiKey;
            changeInputMode(inputMode);
            
            const inputField = document.getElementById("user-input");
            
            // Enterキーでの送信制御（日本語変換中 isComposing の誤発火を防止）
            inputField.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    if (e.isComposing) return;
                    e.preventDefault();
                    submitAnswer();
                }
            });

            // キーボードフォーカス誘導
            window.addEventListener("keydown", (e) => {
                const gameScreen = document.getElementById("screen-game");
                const activeEl = document.activeElement;
                if (!gameScreen.classList.contains("hidden") && activeEl !== inputField && !e.altKey && !e.ctrlKey && !e.metaKey) {
                    if (e.key.length === 1 || e.key === "Backspace" || e.key.startsWith("Arrow")) {
                        inputField.focus();
                    }
                }
            });

            // 起動時に裏で自動認証テスト実行
            checkApiStatusBackground();
        };

        // バックグラウンドでAPIキーの有効性を自動チェック
        async function checkApiStatusBackground() {
            const dot = document.getElementById("status-dot");
            apiKey = localStorage.getItem("groq_api_key") || "";

            if (!apiKey || !navigator.onLine) {
                isApiOnline = false;
                dot.className = "status-dot dot-red";
                dot.title = "オフライン / API未設定";
                return;
            }

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "user", content: "test" }], max_tokens: 1 })
                });

                if (res.ok) {
                    isApiOnline = true;
                    dot.className = "status-dot dot-green";
                    dot.title = "API接続正常（AI問題生成機能：ON）";
                } else {
                    isApiOnline = false;
                    dot.className = "status-dot dot-red";
                    dot.title = "API認証エラー";
                }
            } catch (e) {
                isApiOnline = false;
                dot.className = "status-dot dot-red";
                dot.title = "ネットワークエラー / 通信不可";
            }
        }

        function changeInputMode(mode) {
            inputMode = mode;
            document.getElementById("settings-input-mode").value = mode;
            
            const customKey = document.getElementById("custom-keyboard");
            const flickBtn = document.getElementById("flick-submit-btn");
            const inputField = document.getElementById("user-input");
            
            if (inputMode === "flick") {
                customKey.classList.add("hidden");
                flickBtn.classList.remove("hidden");
                inputField.readOnly = false;
                inputField.placeholder = "ここをタップしてフリック入力";
            } else {
                customKey.classList.remove("hidden");
                flickBtn.classList.add("hidden");
                inputField.readOnly = false;
                inputField.placeholder = "画面ボタンか直接入力";
            }
        }

        // ゲーム開始処理
        async function startGame(mode) {
            initAudio();
            playSound('click');
            activeMode = mode;
            currentIndex = 0;
            lives = 3;

            document.getElementById("screen-title").classList.add("hidden");
            document.getElementById("screen-gameover").classList.add("hidden");
            document.getElementById("screen-clear").classList.add("hidden");
            document.getElementById("screen-loading").classList.remove("hidden");
            startBGM();

            // AI問題生成（オンライン時）
            if (isApiOnline && apiKey && navigator.onLine) {
                document.getElementById("loading-title").innerText = "Groq AIが30問を作成中...";
                document.getElementById("loading-desc").innerText = "難易度とボス配置を計算してオリジナル問題を作成しています。";

                try {
                    let prompt = `あなたは漢字バトルゲームの出題専門AIです。
ユーザーが選択した「${mode}」コース用の全30問の漢字クイズを出題してください。

【ルール】
- 1〜30問にかけて難易度を上げてください。
- 5問ごと（5, 10, 15, 20, 25, 30問目）はBOSSとし、"isBoss": true、"category": "${mode}【BOSS】"としてください。

【出力形式】
以下のJSONオブジェクト構造のみを出力してください。
{
  "questions": [
    {"id":1, "kanji":"川", "reading":"かわ", "category":"${mode}", "meaning":"水が流れる川のこと。", "isBoss":false},
    ... 30問目まで
  ]
}`;

                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);

                    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: [{ role: "user", content: prompt }],
                            temperature: 0.6,
                            max_tokens: 4096,
                            response_format: { type: "json_object" }
                        }),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (res.ok) {
                        const data = await res.json();
                        const jsonContent = JSON.parse(data.choices[0].message.content);
                        if (jsonContent && jsonContent.questions && jsonContent.questions.length > 0) {
                            currentList = jsonContent.questions;
                            initGameScreen();
                            return;
                        }
                    }
                } catch (e) {
                    console.log("AI生成スキップ（内蔵データを使用します）:", e);
                }
            }

            // オフライン時：ランダム問題生成エンジンから読み込み
            document.getElementById("loading-title").innerText = "オフラインモードで起動中...";
            document.getElementById("loading-desc").innerText = "内蔵データベースからランダム30問を構成中...";
            
            setTimeout(() => {
                currentList = generateFallbackData(mode);
                initGameScreen();
            }, 500);
        }

        function initGameScreen() {
            document.getElementById("screen-loading").classList.add("hidden");
            document.getElementById("screen-game").classList.remove("hidden");
            changeInputMode(inputMode);
            loadQuestion();
        }

        async function testApiKey() {
            initAudio();
            playSound('click');
            const key = document.getElementById("api-key-input").value.trim();
            const resResult = document.getElementById("auth-result");
            if (!key) {
                resResult.innerHTML = "<span style='color:#ef4444;'>⚠️ APIキーを入力してください</span>";
                return;
            }
            resResult.innerHTML = "<span style='color:#facc15;'>🔄 認証テスト中...</span>";
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "user", content: "test" }], max_tokens: 5 })
                });
                if (res.ok) {
                    resResult.innerHTML = "<span style='color:#22c55e;'>✅ 認証成功！正常に動作します</span>";
                    playSound('correct');
                    isApiOnline = true;
                    document.getElementById("status-dot").className = "status-dot dot-green";
                } else {
                    resResult.innerHTML = "<span style='color:#ef4444;'>❌ 認証失敗：キーが無効です</span>";
                    playSound('wrong');
                    isApiOnline = false;
                    document.getElementById("status-dot").className = "status-dot dot-red";
                }
            } catch (e) {
                resResult.innerHTML = "<span style='color:#ef4444;'>❌ 通信エラー（オフライン）</span>";
                playSound('wrong');
                isApiOnline = false;
                document.getElementById("status-dot").className = "status-dot dot-red";
            }
        }

        function loadQuestion() {
            if (currentIndex >= currentList.length) {
                document.getElementById("screen-game").classList.add("hidden");
                document.getElementById("screen-clear").classList.remove("hidden");
                return;
            }
            const q = currentList[currentIndex];
            document.getElementById("stage-text").innerText = `STAGE ${currentIndex + 1} / ${currentList.length}`;
            document.getElementById("category-text").innerText = `【${q.category || activeMode}】`;
            document.getElementById("kanji-display").innerText = q.kanji;
            document.getElementById("user-input").value = "";
            document.getElementById("ai-message").innerText = `AI「第${currentIndex + 1}問！制限時間30秒！」`;

            const bossBadge = document.getElementById("boss-badge");
            const enemyEmoji = document.getElementById("enemy-emoji");
            if (q.isBoss) {
                bossBadge.classList.remove("hidden");
                enemyEmoji.innerText = "👹";
                playSound('boss');
            } else {
                bossBadge.classList.add("hidden");
                enemyEmoji.innerText = "👾";
            }

            updateLives();
            resetTimer();
        }

        function updateLives() {
            document.getElementById("lives-container").innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
        }

        function resetTimer() {
            clearInterval(timer);
            timeRemaining = 30;
            document.getElementById("timer-text").innerText = timeRemaining;
            timer = setInterval(() => {
                if (isPaused) return;
                timeRemaining--;
                document.getElementById("timer-text").innerText = timeRemaining;
                if (timeRemaining <= 0) {
                    clearInterval(timer);
                    loseLife();
                }
            }, 1000);
        }

        function addKey(char) {
            initAudio();
            playSound('click');
            const input = document.getElementById("user-input");
            input.value += char;
            input.focus();
        }

        function delKey() {
            initAudio();
            playSound('click');
            const input = document.getElementById("user-input");
            input.value = input.value.slice(0, -1);
            input.focus();
        }

        function addDakuten() {
            initAudio();
            playSound('click');
            const input = document.getElementById("user-input");
            let str = input.value;
            if(!str) return;
            const last = str.slice(-1);
            const map = { "か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご","さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ","た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど","は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ","う":"ゔ" };
            if (map[last]) {
                input.value = str.slice(0, -1) + map[last];
            }
            input.focus();
        }

        function addHandakuten() {
            initAudio();
            playSound('click');
            const input = document.getElementById("user-input");
            let str = input.value;
            if(!str) return;
            const last = str.slice(-1);
            const map = { "は":"ぱ","ひ":"ぴ","ふ":"ぷ","へ":"ぺ","ほ":"ぽ" };
            if (map[last]) {
                input.value = str.slice(0, -1) + map[last];
            }
            input.focus();
        }

        function normalizeText(str) {
            if (!str) return "";
            let text = str.normalize('NFKC');
            text = text.replace(/\s+/g, '');
            text = text.replace(/[\u30a1-\u30f6]/g, function(match) {
                return String.fromCharCode(match.charCodeAt(0) - 0x60);
            });
            return text.trim();
        }

        function submitAnswer() {
            initAudio();
            const inputField = document.getElementById("user-input");
            inputField.blur();

            const rawVal = inputField.value;
            const normalizedInput = normalizeText(rawVal);
            
            if (!normalizedInput) {
                document.getElementById("ai-message").innerText = "AI「文字が入力されていません！解答を入力してください」";
                playSound('click');
                inputField.focus();
                return;
            }

            playSound('click');
            const q = currentList[currentIndex];
            const normalizedAnswer = normalizeText(q.reading);
            
            if (normalizedInput === normalizedAnswer) {
                clearInterval(timer);
                playSound('correct');
                showExplanationModal(q);
            } else {
                loseLife();
            }
        }

        function loseLife() {
            playSound('wrong');
            lives--;
            updateLives();
            const box = document.getElementById("enemy-box");
            box.classList.add("shake");
            setTimeout(() => box.classList.remove("shake"), 300);

            if (lives <= 0) {
                clearInterval(timer);
                document.getElementById("screen-game").classList.add("hidden");
                document.getElementById("screen-gameover").classList.remove("hidden");
                document.getElementById("gameover-stats").innerText = `突破ステージ: ${currentIndex} / ${currentList.length}`;
            } else {
                document.getElementById("ai-message").innerText = `AI「不正解または時間切れ！残りライフ ${lives}」`;
                document.getElementById("user-input").value = "";
            }
        }

        function showExplanationModal(q) {
            document.getElementById("modal-title").innerText = q.isBoss ? "👹 BOSS K.O.!" : "🎉 正解！";
            document.getElementById("modal-kanji").innerText = q.kanji;
            document.getElementById("modal-reading").innerText = `読み：${q.reading}`;
            document.getElementById("modal-meaning").innerText = q.meaning;
            document.getElementById("modal-explanation").classList.remove("hidden");
        }

        function nextStage() {
            initAudio();
            playSound('click');
            document.getElementById("modal-explanation").classList.add("hidden");
            currentIndex++;
            loadQuestion();
        }

        function openSettings() {
            initAudio();
            playSound('click');
            isPaused = true;
            document.getElementById("modal-settings").classList.remove("hidden");
        }

        function closeSettings() {
            initAudio();
            playSound('click');
            apiKey = document.getElementById("api-key-input").value.trim();
            localStorage.setItem("groq_api_key", apiKey);
            isPaused = false;
            document.getElementById("modal-settings").classList.add("hidden");
            changeInputMode(inputMode);
            checkApiStatusBackground();
        }

        function goToTitle() {
            initAudio();
            clearInterval(timer);
            stopBGM();
            isPaused = false;
            document.querySelectorAll(".modal").forEach(m => m.classList.add("hidden"));
            ["screen-loading", "screen-game", "screen-gameover", "screen-clear"].forEach(id => document.getElementById(id).classList.add("hidden"));
            document.getElementById("screen-title").classList.remove("hidden");
            
            checkApiStatusBackground();
        }
    </script>
