<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ネプリーグ風 漢字ツアーズ AI</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%; margin: 0; padding: 0;
            background: #050b14; color: white;
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            overflow-x: hidden;
        }
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100dvh; padding: 10px 0;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
        }
        .container {
            width: 100%; max-width: 450px; padding: 0 15px; text-align: center;
            display: flex; flex-direction: column; align-items: center; position: relative;
        }
        
        .btn { 
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); 
            color: white; padding: 14px; margin: 6px 0; border: 2px solid #60a5fa; border-radius: 12px; 
            font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; 
            box-shadow: 0 4px 10px rgba(29, 78, 216, 0.5);
            touch-action: manipulation; display: block;
        }
        .btn:active { transform: scale(0.97); }

        .key-btn { 
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%); 
            color: white; padding: 8px 0; margin: 2px; border: 1px solid #475569; border-radius: 6px; 
            font-size: 14px; font-weight: bold; cursor: pointer; flex: 1; touch-action: manipulation;
        }
        .key-row { display: flex; width: 100%; justify-content: space-between; margin-bottom: 2px; }

        input, select { 
            width: 100%; padding: 10px; font-size: 18px; text-align: center; border-radius: 10px; 
            border: 2px solid #38bdf8; margin-bottom: 6px; background: #0f172a; color: #fff; font-weight: bold;
        }
        
        .stage-view { 
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%); 
            border: 3px solid #f59e0b; border-radius: 16px; padding: 15px 10px; margin: 6px 0; width: 100%; 
            position: relative; overflow: hidden;
        }

        .kanji-text {
            font-size: 58px; font-weight: 900; line-height: 1.1; color: #ffffff;
            text-shadow: 0 0 10px #38bdf8, 0 0 20px #38bdf8;
        }

        .modal {
            position: fixed; inset: 0; background: rgba(5, 11, 20, 0.95);
            display: flex; align-items: center; justify-content: center; padding: 15px; z-index: 100;
        }
        .modal-content {
            background: #1e293b; border: 2px solid #f59e0b; border-radius: 20px; padding: 20px; width: 100%; max-width: 400px; text-align: center;
        }

        #debug-log {
            color: #f87171; font-size: 11px; margin-top: 10px; text-align: left; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 4px; display: none; width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ヘッダー -->
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <div style="background: #f59e0b; color: #000; font-weight: 900; font-size: 11px; padding: 2px 10px; border-radius: 4px;">ネプリーグ風</div>
            <button onclick="openSettings()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;">
                ⚙️ 設定
            </button>
        </div>

        <!-- タイトル画面 -->
        <div id="screen-title" style="width: 100%; display: block;">
            <h1 style="font-size: 32px; font-weight: 900; color: #facc15; margin: 15px 0;">漢字ツアーズ AI</h1>
            <p style="color: #cbd5e1; font-size: 13px; margin-bottom: 20px;">難易度を選択してゲームスタート！</p>
            
            <button class="btn start-btn" data-mode="小学生">LEVEL 1 🎒 小学生ステージ</button>
            <button class="btn start-btn" data-mode="中学生">LEVEL 2 ✏️ 中学生ステージ</button>
            <button class="btn start-btn" data-mode="高校生">LEVEL 3 🏫 高校生ステージ</button>
            <button class="btn start-btn" data-mode="一般常識">LEVEL 4 💼 一般常識ステージ</button>
            <button class="btn start-btn" style="background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%); border-color: #f87171;" data-mode="漢字王">FINAL LEVEL 👑 漢字王ステージ</button>
        </div>

        <!-- ゲーム画面 -->
        <div id="screen-game" style="width: 100%; display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 6px; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 10px;">
                <div style="text-align: left;">
                    <div id="stage-text" style="font-size: 13px; font-weight: 900; color: #facc15;">STAGE 1 / 30</div>
                    <div id="category-text" style="font-size: 10px; font-weight: bold; color: #38bdf8;">【小学生】</div>
                </div>
                <div id="lives-container" style="font-size: 18px;">🚀🚀🚀</div>
                <div style="background: #0f172a; border: 2px solid #ef4444; padding: 2px 10px; border-radius: 8px; font-weight: 900; font-size: 16px; color: #f87171;">
                    ⏱ <span id="timer-text">15</span>
                </div>
            </div>

            <div style="background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 4px; font-size: 12px; width: 100%; margin-bottom: 6px; text-align: left;">
                🎙️ <span id="ai-message">「問題の読みを入力してください！」</span>
            </div>

            <div class="stage-view" id="enemy-box">
                <div id="enemy-emoji" style="font-size: 32px; margin-bottom: 4px;">👾</div>
                <div id="kanji-display" class="kanji-text">川</div>
            </div>

            <input type="text" id="user-input" placeholder="ひらがなで入力" autocomplete="off">

            <div id="custom-keyboard" style="width: 100%; background: rgba(0,0,0,0.5); padding: 4px; border-radius: 12px;">
                <div class="key-row"><button class="key-btn" onclick="addKey('あ')">あ</button><button class="key-btn" onclick="addKey('い')">い</button><button class="key-btn" onclick="addKey('う')">う</button><button class="key-btn" onclick="addKey('え')">え</button><button class="key-btn" onclick="addKey('お')">お</button></div>
                <div class="key-row"><button class="key-btn" onclick="addKey('か')">か</button><button class="key-btn" onclick="addKey('き')">き</button><button class="key-btn" onclick="addKey('く')">く</button><button class="key-btn" onclick="addKey('け')">け</button><button class="key-btn" onclick="addKey('こ')">こ</button></div>
                <div class="key-row"><button class="key-btn" onclick="addKey('さ')">さ</button><button class="key-btn" onclick="addKey('し')">し</button><button class="key-btn" onclick="addKey('す')">す</button><button class="key-btn" onclick="addKey('せ')">せ</button><button class="key-btn" onclick="addKey('そ')">そ</button></div>
                <div class="key-row"><button class="key-btn" onclick="addKey('た')">た</button><button class="key-btn" onclick="addKey('ち')">ち</button><button class="key-btn" onclick="addKey('つ')">つ</button><button class="key-btn" onclick="addKey('て')">て</button><button class="key-btn" onclick="addKey('と')">と</button></div>
                <div class="key-row"><button class="key-btn" onclick="addKey('な')">な</button><button class="key-btn" onclick="addKey('に')">に</button><button class="key-btn" onclick="addKey('ぬ')">ぬ</button><button class="key-btn" onclick="addKey('ね')">ね</button><button class="key-btn" onclick="addKey('の')">の</button></div>
                <div class="key-row"><button class="key-btn" onclick="addKey('は')">は</button><button class="key-btn" onclick="addKey('ひ')">ひ</button><button class="key-btn" onclick="addKey('ふ')">ふ</button><button class="key-btn" onclick="addKey('へ')">へ</button><button class="key-btn" onclick="addKey('ほ')">ほ</button></div>
                <div class="key-row"><button class="key-btn" onclick="addKey('ま')">ま</button><button class="key-btn" onclick="addKey('み')">み</button><button class="key-btn" onclick="addKey('む')">む</button><button class="key-btn" onclick="addKey('め')">め</button><button class="key-btn" onclick="addKey('も')">も</button></div>
                <div class="key-row"><button class="key-btn" onclick="addKey('や')">や</button><button class="key-btn" style="opacity:0.2;">-</button><button class="key-btn" onclick="addKey('ゆ')">ゆ</button><button class="key-btn" style="opacity:0.2;">-</button><button class="key-btn" onclick="addKey('よ')">よ</button></div>
                <div class="key-row"><button class="key-btn" onclick="addKey('ら')">ら</button><button class="key-btn" onclick="addKey('り')">り</button><button class="key-btn" onclick="addKey('る')">る</button><button class="key-btn" onclick="addKey('れ')">れ</button><button class="key-btn" onclick="addKey('ろ')">ろ</button></div>
                <div class="key-row">
                    <button class="key-btn" onclick="addKey('わ')">わ</button><button class="key-btn" onclick="addKey('を')">を</button><button class="key-btn" onclick="addKey('ん')">ん</button><button class="key-btn" onclick="addKey('っ')">っ</button><button class="key-btn" onclick="addKey('ー')">ー</button>
                </div>
                <div class="key-row" style="margin-top: 3px;">
                    <button class="key-btn" style="background:#d97706;" onclick="addDakuten()">濁点 ”</button>
                    <button class="key-btn" style="background:#dc2626;" onclick="delKey()">1文字消す</button>
                    <button class="key-btn" style="background: linear-gradient(180deg, #22c55e 0%, #15803d 100%); flex: 1.5; font-size: 16px;" onclick="submitAnswer()">攻撃（決定）</button>
                </div>
            </div>
        </div>

        <!-- 解説モーダル -->
        <div id="modal-explanation" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 id="modal-title" style="font-size: 26px; margin-bottom: 5px;">💥 CLEAR!</h2>
                <div id="modal-kanji" style="font-size: 48px; font-weight: 900; margin: 6px 0; color: #facc15;">漢字</div>
                <div id="modal-reading" style="font-size: 20px; color: #4ade80; margin-bottom: 12px;">【読み】よみ</div>
                <div style="background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px; text-align: left; font-size: 13px; margin-bottom: 15px;">
                    <div id="modal-meaning">解説文</div>
                </div>
                <button id="modal-next-btn" class="btn" style="background: #22c55e;" onclick="nextStage()">次のステージへ ➔</button>
            </div>
        </div>

        <!-- 設定モーダル -->
        <div id="modal-settings" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 style="color: #facc15; font-size: 20px; margin-bottom: 12px;">⚙️ 設定</h2>
                <p style="font-size: 12px; color: #cbd5e1; margin-bottom: 15px;">ゲーム設定画面です。</p>
                <button class="btn" style="background: #22c55e;" onclick="closeSettings()">閉じる</button>
                <button class="btn" style="background: #dc2626;" onclick="goToTitle()">タイトルに戻る</button>
            </div>
        </div>

        <!-- デバッグログ表示エリア -->
        <div id="debug-log"></div>
    </div>

    <script>
        // エラー検出用ハンドラ
        window.onerror = function(msg, url, line) {
            const log = document.getElementById("debug-log");
            if (log) {
                log.style.display = "block";
                log.innerText = "エラー検出: " + msg + " (行: " + line + ")";
            }
            return false;
        };

        const KANJI_DATABASE = {
            "小学生": [
                ["川","かわ","水が流れる場所。"],["山","やま","周囲より高い土地。"],["木","き","植物の一種。"],["車","くるま","乗り物。"],["花","はな","植物の咲かせるきれいな部分。"]
            ],
            "中学生": [
                ["笑顔","えがお","にこにこした顔。"],["挨拶","あいさつ","人と会う時の言葉。"],["感謝","かんしゃ","ありがたく思う気持ち。"]
            ],
            "高校生": [
                ["明瞭","めいりょう","はっきりしている様子。"],["躊躇","ちゅうちょ","ためらうこと。"]
            ],
            "一般常識": [
                ["醤油","しょうゆ","日本の基礎調味料。"],["流石","さすが","評判通り素晴らしいこと。"]
            ],
            "漢字王": [
                ["魑魅魍魎","ちみもうりょう","いろいろなバケモノのこと。"],["蒲公英","たんぽぽ","黄色い花を咲かせる植物。"]
            ]
        };

        let currentList = [];
        let currentIndex = 0;
        let lives = 3;
        let timer = null;
        let timeRemaining = 15;
        let activeMode = "小学生";

        // 初期化処理
        window.addEventListener("DOMContentLoaded", () => {
            // タイトルボタンのイベント登録をJavaScript側からも確実に行う
            const btns = document.querySelectorAll(".start-btn");
            btns.forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const mode = e.currentTarget.getAttribute("data-mode");
                    startGame(mode);
                });
            });

            // Enterキーで回答送信
            document.getElementById("user-input").addEventListener("keydown", (e) => {
                if (e.key === "Enter") submitAnswer();
            });
        });

        // ゲーム開始処理（即時画面遷移）
        function startGame(mode) {
            activeMode = mode;
            currentIndex = 0;
            lives = 3;

            // データ準備
            const pool = KANJI_DATABASE[mode] || KANJI_DATABASE["小学生"];
            currentList = [];
            for (let i = 0; i < 30; i++) {
                const item = pool[i % pool.length];
                currentList.push({
                    id: i + 1,
                    kanji: item[0],
                    reading: item[1],
                    meaning: item[2]
                });
            }

            // 画面を直接切り替え
            document.getElementById("screen-title").style.display = "none";
            document.getElementById("screen-game").style.display = "block";

            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= currentList.length) {
                alert("全ステージクリア！");
                goToTitle();
                return;
            }

            const q = currentList[currentIndex];
            document.getElementById("stage-text").innerText = `STAGE ${currentIndex + 1} / ${currentList.length}`;
            document.getElementById("category-text").innerText = `【${activeMode}】`;
            document.getElementById("kanji-display").innerText = q.kanji;
            document.getElementById("user-input").value = "";

            updateLives();
            resetTimer();
        }

        function updateLives() {
            document.getElementById("lives-container").innerText = "🚀".repeat(lives) + "💥".repeat(3 - lives);
        }

        function resetTimer() {
            clearInterval(timer);
            timeRemaining = 15;
            document.getElementById("timer-text").innerText = timeRemaining;

            timer = setInterval(() => {
                timeRemaining--;
                document.getElementById("timer-text").innerText = timeRemaining;

                if (timeRemaining <= 0) {
                    clearInterval(timer);
                    showExplanationModal(currentList[currentIndex], false);
                }
            }, 1000);
        }

        function addKey(char) {
            const input = document.getElementById("user-input");
            input.value += char;
        }

        function delKey() {
            const input = document.getElementById("user-input");
            input.value = input.value.slice(0, -1);
        }

        function addDakuten() {
            const input = document.getElementById("user-input");
            let str = input.value;
            if(!str) return;
            const last = str.slice(-1);
            const map = { "か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご","さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ","た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど","は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ" };
            if (map[last]) input.value = str.slice(0, -1) + map[last];
        }

        function submitAnswer() {
            const inputVal = document.getElementById("user-input").value.trim();
            if (!inputVal) return;

            const q = currentList[currentIndex];
            if (inputVal === q.reading) {
                clearInterval(timer);
                showExplanationModal(q, true);
            } else {
                lives--;
                updateLives();
                if (lives <= 0) {
                    clearInterval(timer);
                    alert("ゲームオーバー！タイトルに戻ります。");
                    goToTitle();
                } else {
                    document.getElementById("ai-message").innerText = `🎙️「不正解！残りライフ ${lives}」`;
                    document.getElementById("user-input").value = "";
                }
            }
        }

        function showExplanationModal(q, isClear) {
            const modal = document.getElementById("modal-explanation");
            document.getElementById("modal-title").innerText = isClear ? "💥 CLEAR!" : "⏰ タイムアップ！";
            document.getElementById("modal-kanji").innerText = q.kanji;
            document.getElementById("modal-reading").innerText = `【読み】${q.reading}`;
            document.getElementById("modal-meaning").innerText = q.meaning;
            modal.style.display = "flex";
        }

        function nextStage() {
            document.getElementById("modal-explanation").style.display = "none";
            currentIndex++;
            loadQuestion();
        }

        function openSettings() {
            document.getElementById("modal-settings").style.display = "flex";
        }

        function closeSettings() {
            document.getElementById("modal-settings").style.display = "none";
        }

        function goToTitle() {
            clearInterval(timer);
            document.getElementById("modal-explanation").style.display = "none";
            document.getElementById("modal-settings").style.display = "none";
            document.getElementById("screen-game").style.display = "none";
            document.getElementById("screen-title").style.display = "block";
        }
    </script>
</body>
</html>
