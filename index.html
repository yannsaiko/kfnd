<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字クイズチャレンジ</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --boss-color: #9b59b6;
            --bg-color: #f5f7fa;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .btn-grid {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none !important;
        }

        /* クイズ画面 */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #666;
            margin-bottom: 15px;
        }

        .kanji-display {
            font-size: 64px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid #e9ecef;
        }

        .kanji-display.boss {
            color: var(--boss-color);
            border-color: var(--boss-color);
            background: #f3e8f9;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
        }

        .result-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .result-message.correct {
            background-color: #d4edda;
            color: #155724;
        }

        .result-message.wrong {
            background-color: #f8d7da;
            color: #721c24;
        }

        .meaning-box {
            font-size: 14px;
            color: #555;
            margin-top: 8px;
            text-align: left;
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 4px solid var(--primary-color);
        }

        .score-display {
            font-size: 48px;
            color: var(--primary-color);
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. モード選択画面 -->
    <div id="start-screen">
        <h1>漢字読みクイズ</h1>
        <p>挑戦するコースを選んでください</p>
        <div class="btn-grid">
            <button onclick="startGame('小学生')">小学生コース</button>
            <button onclick="startGame('中学生')">中学生コース</button>
            <button onclick="startGame('高校生')">高校生コース</button>
            <button onclick="startGame('一般常識')">一般常識コース</button>
            <button onclick="startGame('漢字王')" style="background-color: var(--boss-color);">漢字王コース</button>
        </div>
    </div>

    <!-- 2. クイズ対戦画面 -->
    <div id="quiz-screen" class="hidden">
        <div class="quiz-header">
            <span id="category-tag">コース名</span>
            <span id="progress-text">1 / 10</span>
        </div>

        <div id="kanji-box" class="kanji-display">漢字</div>

        <form id="quiz-form" onsubmit="submitAnswer(event)">
            <input type="text" id="answer-input" placeholder="ひらがなで入力" autocomplete="off" autofocus>
            <button type="submit" id="submit-btn">回答する</button>
        </form>

        <div id="feedback" class="hidden">
            <div id="result-text" class="result-message"></div>
            <button onclick="nextQuestion()" style="margin-top: 15px; width: 100%;">次の問題へ</button>
        </div>
    </div>

    <!-- 3. リザルト（結果）画面 -->
    <div id="result-screen" class="hidden">
        <h1>結果発表</h1>
        <p>あなたのスコア</p>
        <div id="final-score" class="score-display">0 / 10</div>
        <button onclick="showStartScreen()" style="width: 100%;">タイトルに戻る</button>
    </div>
</div>

<script>
    // フォールバック（JSONファイルが読めない場合に使う内蔵データ）
    const DEFAULT_DATABASE = {
        "小学生": [["川", "かわ", "水が流れるすじ。"], ["山", "やま", "高く盛り上がった土地。"]],
        "中学生": [["挨拶", "あいさつ", "出会いの言葉。"], ["故郷", "ふるさと", "生まれ育った場所。"]],
        "高校生": [["概念", "がいねん", "大まかな意味。"], ["躊躇", "ちゅうちょ", "ためらうこと。"]],
        "一般常識": [["醤油", "しょうゆ", "調味料。"], ["代替", "だいたい", "代わりにすること。"]],
        "漢字王": [["魑魅魍魎", "ちみもうりょう", "妖怪のこと。"], ["紫陽花", "あじさい", "梅雨に咲く花。"]]
    };

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let externalData = null;

    // 起動時に外部JSON（kanji_data.json）の読み込みを試みる
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('kanji_data.json');
            if (res.ok) {
                externalData = await res.json();
                console.log("kanji_data.json の読み込み成功！");
            }
        } catch (e) {
            console.log("外部JSONが見つからないため内蔵データを使用します。");
        }
    });

    // ゲーム開始処理
    async function startGame(mode) {
        currentIndex = 0;
        score = 0;
        
        let pool = [];

        // 外部JSONデータがある場合はそこから取得、なければフォールバック
        if (externalData && externalData[mode]) {
            pool = externalData[mode];
        } else if (DEFAULT_DATABASE[mode]) {
            pool = DEFAULT_DATABASE[mode].map(item => ({ kanji: item[0], reading: item[1], meaning: item[2] }));
        }

        // シャッフルして最大10問を抽出
        const shuffled = [...pool].sort(() => 0.5 - Math.random());
        currentQuestions = shuffled.slice(0, 10);

        if (currentQuestions.length === 0) {
            alert("問題が見つかりませんでした。");
            return;
        }

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');

        showQuestion();
    }

    // 問題を表示
    function showQuestion() {
        const q = currentQuestions[currentIndex];
        const isBoss = (currentIndex + 1) % 5 === 0; // 5問ごとにボス扱い

        document.getElementById('category-tag').innerText = isBoss ? `${q.category || ''} 【BOSS】` : (q.category || '問題');
        document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${currentQuestions.length}`;
        
        const kanjiBox = document.getElementById('kanji-box');
        kanjiBox.innerText = q.kanji;
        
        if (isBoss) {
            kanjiBox.classList.add('boss');
        } else {
            kanjiBox.classList.remove('boss');
        }

        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').disabled = false;
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('answer-input').focus();
    }

    // 回答チェック
    function submitAnswer(e) {
        e.preventDefault();
        const input = document.getElementById('answer-input').value.trim();
        const q = currentQuestions[currentIndex];
        
        if (!input) return;

        const isCorrect = input === q.reading;
        if (isCorrect) score++;

        document.getElementById('answer-input').disabled = true;
        document.getElementById('submit-btn').classList.add('hidden');

        const feedback = document.getElementById('feedback');
        const resultText = document.getElementById('result-text');

        resultText.className = `result-message ${isCorrect ? 'correct' : 'wrong'}`;
        resultText.innerHTML = `
            <div>${isCorrect ? '⭕ 正解！' : `❌ 不正解... (正解: ${q.reading})`}</div>
            <div class="meaning-box">💡 意味: ${q.meaning || '解説なし'}</div>
        `;

        feedback.classList.remove('hidden');
    }

    // 次の問へ
    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    // リザルト表示
    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length}`;
    }

    // タイトルへ戻る
    function showStartScreen() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }
</script>
</body>
</html>
