        body { 
            background: #0f172a; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow-x: hidden;
        }
        .container {
            width: 100%; max-width: 450px; padding: 15px; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }
        .hidden { display: none !important; }
        .btn { 
            background: #2563eb; color: white; padding: 14px; margin: 6px 0; border: none; border-radius: 12px; 
            font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn:active { transform: scale(0.98); background: #1d4ed8; }

        .key-btn { 
            background: #334155; color: white; padding: 10px 0; margin: 2px; border: none; border-radius: 6px; 
            font-size: 15px; font-weight: bold; cursor: pointer; flex: 1; box-shadow: 0 2px 3px rgba(0,0,0,0.2);
        }
        .key-btn:active { background: #1e293b; }
        .key-row { display: flex; width: 100%; justify-content: space-between; margin-bottom: 3px; }

        input, select { 
            width: 100%; padding: 12px; font-size: 16px; text-align: center; border-radius: 10px; 
            border: 2px solid #cbd5e1; margin-bottom: 8px; background: white; color: black; font-weight: bold;
        }
        
        .box { 
            background: #1e293b; border: 3px solid #eab308; border-radius: 16px; padding: 16px; margin: 10px 0; width: 100%; 
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.3); position: relative;
        }
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
        }
        .modal-content {
            background: #1e1b4b; border: 2px solid #6366f1; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; text-align: center;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>

    <script>
        let audioCtx = null;
        let soundVolume = 0.5;
        let bgmTimer = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function updateVolume(val) {
            soundVolume = val / 100;
            document.getElementById("volume-val").innerText = val;
            playSound('click');
        }

        function startBGM() {
            stopBGM();
            let notes = [261.63, 329.63, 392.00, 523.25];
            let step = 0;
            bgmTimer = setInterval(() => {
                if (soundVolume <= 0 || isPaused || !audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const now = audioCtx.currentTime;

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[step % notes.length], now);
                    gain.gain.setValueAtTime(0.03 * soundVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    step++;
                } catch(e) {}
            }, 400);
        }

        function stopBGM() {
            if (bgmTimer) clearInterval(bgmTimer);
        }

        function playSound(type) {
            initAudio();
            if (soundVolume <= 0 || !audioCtx) return;
            
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                let baseVolume = 0.2 * soundVolume;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(baseVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    gain.gain.setValueAtTime(baseVolume * 1.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.setValueAtTime(110, now + 0.15);
                    gain.gain.setValueAtTime(baseVolume * 1.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'boss') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(880, now + 0.2);
                    gain.gain.setValueAtTime(baseVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                }
            } catch(e) {}
        }

                ]
            };

            const selected = rawData[mode] || rawData["小学生"];
            return selected.map((item, index) => {
                const isBoss = (index + 1) % 5 === 0;
                return {
                    id: index + 1,
                    kanji: item[0],
                    reading: item[1],
                    category: isBoss ? `${mode}【BOSS】` : mode,
                    meaning: `【STAGE ${index + 1}】${mode}コースの漢字問題です。`,
                    isBoss: isBoss
                };
            });
        }

        let currentList = [];
        let currentIndex = 0;
        let lives = 3;
        let timer = null;
        let timeRemaining = 30;
        let isPaused = false;
        let activeMode = "小学生";
        let inputMode = "keyboard";
        let apiKey = localStorage.getItem("groq_api_key") || "";

        window.onload = () => {
            document.getElementById("api-key-input").value = apiKey;
            changeInputMode(inputMode);
            
            const inputField = document.getElementById("user-input");
            
            // PCキーボード入力・方向キー操作の処理
            inputField.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    submitAnswer();
                }
                // 左右矢印キー(ArrowLeft, ArrowRight)やBackspace等のキー操作はそのまま標準動作（カーソル移動等）を許可
            });

            // ゲーム中に画面上のどこかを押しても入力欄にフォーカスを誘導
            window.addEventListener("keydown", (e) => {
                const gameScreen = document.getElementById("screen-game");
                const activeEl = document.activeElement;
                if (!gameScreen.classList.contains("hidden") && activeEl !== inputField && !e.altKey && !e.ctrlKey && !e.metaKey) {
                    if (e.key.length === 1 || e.key === "Backspace" || e.key.startsWith("Arrow")) {
                        inputField.focus();
                    }
                }
            });
        };

        function changeInputMode(mode) {
            inputMode = mode;
            document.getElementById("settings-input-mode").value = mode;
            
            const customKey = document.getElementById("custom-keyboard");
            const flickBtn = document.getElementById("flick-submit-btn");
            const inputField = document.getElementById("user-input");
            
            if (inputMode === "flick") {
                customKey.classList.add("hidden");
                flickBtn.classList.remove("hidden");
                inputField.readOnly = false;
                inputField.placeholder = "キーボード等で入力";
            } else {
                customKey.classList.remove("hidden");
                flickBtn.classList.add("hidden");
                inputField.readOnly = false;
                inputField.placeholder = "画面ボタンか直接入力";
            }
        }

        // Groq APIで30問を全自動生成
        async function startGame(mode) {
            initAudio();
            playSound('click');
            startBGM();
            activeMode = mode;
            currentIndex = 0;
            lives = 3;
            
            document.getElementById("screen-title").classList.add("hidden");
            document.getElementById("screen-gameover").classList.add("hidden");
            document.getElementById("screen-clear").classList.add("hidden");
            document.getElementById("screen-loading").classList.remove("hidden");

            apiKey = document.getElementById("api-key-input").value.trim();

            if (apiKey) {
                try {
                    let prompt = `あなたは漢字バトルゲームの出題専門AIです。
ユーザーが選択した「${mode}」コース用の全30問の漢字クイズを出題してください。

【コースごとの基準難易度】
1. 小学生コース：難易度★☆☆☆☆（小学校1〜6年で習う漢字のみ）
2. 中学生コース：難易度★★☆☆☆（中学校で習う常用漢字・語彙）
3. 高校生コース：難易度★★★☆☆（高校レベルの常用漢字・一般難読語）
4. 一般常識コース：難易度★★★★☆（社会人向け常識漢字・難読地名・慣用句等）
5. 漢字王コース：難易度★★★★★（最難関・漢検1級レベル・超難読漢字）

【30問の構成と難易度曲線】
- 1問目〜30問目にかけて、コース内の限界の範囲で段階的に難易度を上げてください。
- 5問ごと（5問目, 10問目, 15問目, 20問目, 25問目, 30問目）はBOSS問題とし、"isBoss": true、"category": "${mode}【BOSS】" としてください。
- 特に最後の30問目はコース内最大の難易度（FINAL BOSS）にしてください。

【出力仕様】
JSON配列（要素数30）のみを出力してください。マークダウンや解説文は含めないでください。
readingは全角ひらがなのみ。

[
  {"id":1, "kanji":"...", "reading":"...", "category":"${mode}", "meaning":"...", "isBoss":false},
  ...
  {"id":30, "kanji":"...", "reading":"...", "category":"${mode}【BOSS】", "meaning":"...", "isBoss":true}
]`;

                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 12000);

                    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: [{ role: "user", content: prompt }],
                            temperature: 0.7
                        }),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (res.ok) {
                        const data = await res.json();
                        let jsonText = data.choices[0].message.content.trim();
                        
                        const jsonMatch = jsonText.match(/\[\s*\{[\s\S]*\}\s*\]/);
                        if (jsonMatch) {
                            jsonText = jsonMatch[0];
                        }
                        
                        currentList = JSON.parse(jsonText);
                        if (currentList.length > 0) {
                            initGameScreen();
                            return;
                        }
                    }
                } catch (e) {
                    console.log("AI生成失敗またはタイムアウト、内蔵データを使用します:", e);
                }
            }

            // API未設定・エラー時はフォールバックデータを使用
            currentList = generateFallbackList(mode);
            initGameScreen();
        }

        function initGameScreen() {
            document.getElementById("screen-loading").classList.add("hidden");
            document.getElementById("screen-game").classList.remove("hidden");
            loadQuestion();
        }

        async function testApiKey() {
            initAudio();
            playSound('click');
            const key = document.getElementById("api-key-input").value.trim();
            const resResult = document.getElementById("auth-result");
            if (!key) {
                resResult.innerHTML = "<span style='color:#ef4444;'>⚠️ APIキーを入力してください</span>";
                return;
            }
            resResult.innerHTML = "<span style='color:#facc15;'>🔄 認証テスト中...</span>";
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "user", content: "test" }], max_tokens: 5 })
                });
                if (res.ok) {
                    resResult.innerHTML = "<span style='color:#22c55e;'>✅ 認証成功！正常に動作します</span>";
                    playSound('correct');
                } else {
                    resResult.innerHTML = "<span style='color:#ef4444;'>❌ 認証失敗：キーが無効です</span>";
                    playSound('wrong');
                }
            } catch (e) {
                resResult.innerHTML = "<span style='color:#ef4444;'>❌ 通信エラー</span>";
                playSound('wrong');
            }
        }

        function loadQuestion() {
            if (currentIndex >= currentList.length) {
                document.getElementById("screen-game").classList.add("hidden");
                document.getElementById("screen-clear").classList.remove("hidden");
                return;
            }
            const q = currentList[currentIndex];
            document.getElementById("stage-text").innerText = `STAGE ${currentIndex + 1} / ${currentList.length}`;
            document.getElementById("category-text").innerText = `【${q.category}】`;
            document.getElementById("kanji-display").innerText = q.kanji;
            document.getElementById("user-input").value = "";
            document.getElementById("ai-message").innerText = `AI「第${currentIndex + 1}問！制限時間30秒！」`;

            const bossBadge = document.getElementById("boss-badge");
            const enemyEmoji = document.getElementById("enemy-emoji");
            if (q.isBoss) {
                bossBadge.classList.remove("hidden");
                enemyEmoji.innerText = "👹";
                playSound('boss');
            } else {
                bossBadge.classList.add("hidden");
                enemyEmoji.innerText = "👾";
            }

            updateLives();
            resetTimer();
        }

        function updateLives() {
            document.getElementById("lives-container").innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
        }

        function resetTimer() {
            clearInterval(timer);
            timeRemaining = 30;
            document.getElementById("timer-text").innerText = timeRemaining;
            timer = setInterval(() => {
                if (isPaused) return;
                timeRemaining--;
                document.getElementById("timer-text").innerText = timeRemaining;
                if (timeRemaining <= 0) {
                    clearInterval(timer);
                    loseLife();
                }
            }, 1000);
        }

        function addKey(char) {
            initAudio();
            playSound('click');
            const input = document.getElementById("user-input");
            input.value += char;
            input.focus();
        }

        function delKey() {
            initAudio();
            playSound('click');
            const input = document.getElementById("user-input");
            input.value = input.value.slice(0, -1);
            input.focus();
        }

        function addDakuten() {
            initAudio();
            playSound('click');
            const input = document.getElementById("user-input");
            let str = input.value;
            if(!str) return;
            const last = str.slice(-1);
            const map = { "か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご","さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ","た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど","は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ","う":"ゔ" };
            if (map[last]) {
                input.value = str.slice(0, -1) + map[last];
            }
            input.focus();
        }

        function addHandakuten() {
            initAudio();
            playSound('click');
            const input = document.getElementById("user-input");
            let str = input.value;
            if(!str) return;
            const last = str.slice(-1);
            const map = { "は":"ぱ","ひ":"ぴ","ふ":"ぷ","へ":"ぺ","ほ":"ぽ" };
            if (map[last]) {
                input.value = str.slice(0, -1) + map[last];
            }
            input.focus();
        }

        function toHiragana(str) {
            return str.replace(/[\u30a1-\u30f6]/g, function(match) {
                var chr = match.charCodeAt(0) - 0x60;
                return String.fromCharCode(chr);
            });
        }

        function submitAnswer() {
            initAudio();
            const rawVal = document.getElementById("user-input").value.trim();
            
            // 未入力（空送信）の判定：ペナルティなしでメッセージのみ出力
            if (!rawVal) {
                document.getElementById("ai-message").innerText = "AI「文字が入力されていません！解答を入力してください」";
                playSound('click');
                return;
            }

            playSound('click');
            const val = toHiragana(rawVal);
            const q = currentList[currentIndex];
            
            if (val === toHiragana(q.reading.trim())) {
                clearInterval(timer);
                playSound('correct');
                showExplanationModal(q);
            } else {
                loseLife();
            }
        }

        function loseLife() {
            playSound('wrong');
            lives--;
            updateLives();
            const box = document.getElementById("enemy-box");
            box.classList.add("shake");
            setTimeout(() => box.classList.remove("shake"), 300);

            if (lives <= 0) {
                clearInterval(timer);
                document.getElementById("screen-game").classList.add("hidden");
                document.getElementById("screen-gameover").classList.remove("hidden");
                document.getElementById("gameover-stats").innerText = `突破ステージ: ${currentIndex} / ${currentList.length}`;
            } else {
                document.getElementById("ai-message").innerText = `AI「不正解または時間切れ！残りライフ ${lives}」`;
                document.getElementById("user-input").value = "";
            }
        }

        function showExplanationModal(q) {
            document.getElementById("modal-title").innerText = q.isBoss ? "👹 BOSS K.O.!" : "🎉 正解！";
            document.getElementById("modal-kanji").innerText = q.kanji;
            document.getElementById("modal-reading").innerText = `読み：${q.reading}`;
            document.getElementById("modal-meaning").innerText = q.meaning;
            document.getElementById("modal-explanation").classList.remove("hidden");
        }

        function nextStage() {
            initAudio();
            playSound('click');
            document.getElementById("modal-explanation").classList.add("hidden");
            currentIndex++;
            loadQuestion();
        }

        function openSettings() {
            initAudio();
            playSound('click');
            isPaused = true;
            document.getElementById("modal-settings").classList.remove("hidden");
        }

        function closeSettings() {
            initAudio();
            playSound('click');
            apiKey = document.getElementById("api-key-input").value.trim();
            localStorage.setItem("groq_api_key", apiKey);
            isPaused = false;
            document.getElementById("modal-settings").classList.add("hidden");
        }

        function goToTitle() {
            initAudio();
            clearInterval(timer);
            stopBGM();
            isPaused = false;
            document.querySelectorAll(".modal").forEach(m => m.classList.add("hidden"));
            ["screen-loading", "screen-game", "screen-gameover", "screen-clear"].forEach(id => document.getElementById(id).classList.add("hidden"));
            document.getElementById("screen-title").classList.remove("hidden");
        }
    </script>
</body>
</html>
