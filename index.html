<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ネプリーグ風 漢字ツアーズ AI</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0; padding: 0;
            background: #0f172a; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100dvh; overflow-y: auto; padding: 10px 0;
        }
        .container {
            width: 100%; max-width: 450px; padding: 0 15px; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }
        .hidden { display: none !important; }
        .btn { 
            background: #2563eb; color: white; padding: 12px; margin: 5px 0; border: none; border-radius: 12px; 
            font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.98); background: #1d4ed8; }

        /* ゲーム表示エリア */
        .stage-box {
            background: #1e293b; border: 2px solid #38bdf8; border-radius: 12px;
            width: 100%; padding: 20px 10px; margin-bottom: 15px; text-align: center;
        }
        .question-text { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #f3f4f6; }
        .kanji-display { font-size: 40px; font-weight: bold; color: #facc15; letter-spacing: 4px; }

        /* 解答入力エリア */
        .input-display {
            background: #0f172a; border: 2px solid #475569; border-radius: 8px;
            width: 100%; height: 50px; font-size: 24px; line-height: 46px;
            margin-bottom: 15px; text-align: center; font-weight: bold; color: #38bdf8;
        }

        /* モーダルオーバーレイ */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 1; transition: opacity 0.2s ease;
        }
        .modal-card {
            background: #1e293b; border: 2px solid #38bdf8; border-radius: 16px;
            width: 90%; max-width: 380px; padding: 20px; text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .modal-title { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .modal-title.correct { color: #4ade80; }
        .modal-title.incorrect { color: #f87171; }

        .modal-body { text-align: left; background: #0f172a; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .modal-item { margin-bottom: 8px; font-size: 15px; line-height: 1.5; }
        .modal-item strong { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container">
        <h2>漢字ツアーズ AI</h2>
        
        <div class="stage-box">
            <div class="question-text" id="question">第1問：ひらがなを漢字に変換せよ</div>
            <div class="kanji-display" id="target-kanji">●●する</div>
        </div>

        <div class="input-display" id="input-box"></div>
        <button class="btn" onclick="submitAnswer()">回答する</button>
    </div>

    <!-- 解説モーダル -->
    <div id="explanation-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div id="modal-result-title" class="modal-title correct">正解！</div>
            
            <div class="modal-body">
                <div class="modal-item"><strong>正解：</strong> <span id="modal-answer"></span></div>
                <div class="modal-item"><strong>読み：</strong> <span id="modal-reading"></span></div>
                <div class="modal-item"><strong>意味：</strong> <span id="modal-meaning"></span></div>
                <div class="modal-item"><strong>例文：</strong> <span id="modal-example"></span></div>
            </div>

            <button class="btn" onclick="closeModal()">次の問題へ</button>
        </div>
    </div>

    <script>
        // サンプル問題データ
        const currentProblem = {
            kanji: "挑戦",
            reading: "ちょうせん",
            meaning: "困難なことや新しいことに立ち向かうこと。",
            example: "新記録に挑戦する。"
        };

        // 仮の入力文字列
        let currentInput = "挑戦";
        document.getElementById('input-box').innerText = currentInput;

        function submitAnswer() {
            const isCorrect = (currentInput === currentProblem.kanji);
            showExplanation(isCorrect);
        }

        function showExplanation(isCorrect) {
            const titleEl = document.getElementById('modal-result-title');
            
            if (isCorrect) {
                titleEl.innerText = "正解！";
                titleEl.className = "modal-title correct";
            } else {
                titleEl.innerText = "不正解...";
                titleEl.className = "modal-title incorrect";
            }

            document.getElementById('modal-answer').innerText = currentProblem.kanji;
            document.getElementById('modal-reading').innerText = currentProblem.reading;
            document.getElementById('modal-meaning').innerText = currentProblem.meaning;
            document.getElementById('modal-example').innerText = currentProblem.example;

            document.getElementById('explanation-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('explanation-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
